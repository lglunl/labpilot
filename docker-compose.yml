# LabPilot 全容器部署（app + ollama + cloudflared）
# 用法：docker compose up -d --build
#
# 迁移到新电脑：把整个项目目录拷过去，装好 Docker Desktop，执行上面那条命令即可。
# 首次启动会自动拉取 7B 模型（约 4.7GB），耐心等几分钟。

services:
  # 推理引擎
  ollama:
    image: ollama/ollama:latest
    container_name: labpilot-ollama
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # 单模型串行，避免多模型抢内存
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # 一次性任务：确保模型存在（已存在则秒退）
  model-init:
    image: ollama/ollama:latest
    container_name: labpilot-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}"]
    restart: "no"

  # Web 服务 + 摘要 API（同时托管前端静态文件）
  app:
    build: .
    image: labpilot-app:latest
    container_name: labpilot-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      OLLAMA_NUM_CTX: "8192"
      OLLAMA_NUM_PREDICT: "600"
      OLLAMA_TIMEOUT_MS: "150000"
      OLLAMA_KEEP_ALIVE: 30m
      MAX_QUEUE: "3"
      CACHE_TTL_MS: "600000"
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  # 外网隧道（可选，不需要外网访问可以注释掉这一段）
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: labpilot-tunnel
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app
    restart: unless-stopped

volumes:
  ollama-models:
