<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e6e64">
  <meta name="description" content="LabPilot 智慧实验室协作与仪器台账平台">
  <title>LabPilot 智研台</title>
  <link rel="icon" href="assets/lab-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-message" viewBox="0 0 24 24">
      <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
      <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
    </symbol>
    <symbol id="icon-clipboard" viewBox="0 0 24 24">
      <rect width="14" height="18" x="5" y="4" rx="2"/>
      <path d="M9 4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 12h6M9 16h6"/>
    </symbol>
    <symbol id="icon-bot" viewBox="0 0 24 24">
      <path d="M12 8V4H8M6 8h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/>
      <path d="M9 13v2M15 13v2M2 14h2M20 14h2"/>
    </symbol>
    <symbol id="icon-dashboard" viewBox="0 0 24 24">
      <rect width="7" height="9" x="3" y="3" rx="1"/>
      <rect width="7" height="5" x="14" y="3" rx="1"/>
      <rect width="7" height="9" x="14" y="12" rx="1"/>
      <rect width="7" height="5" x="3" y="16" rx="1"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M5 12h14M12 5v14"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6"/>
    </symbol>
    <symbol id="icon-more" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
    </symbol>
    <symbol id="icon-paperclip" viewBox="0 0 24 24">
      <path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.7 9.6a2 2 0 0 1-2.8-2.8l8.9-8.9"/>
    </symbol>
    <symbol id="icon-smile" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>
    </symbol>
    <symbol id="icon-send" viewBox="0 0 24 24">
      <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
    </symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24">
      <path d="m12 3-1.9 5.1L5 10l5.1 1.9L12 17l1.9-5.1L19 10l-5.1-1.9Z"/>
      <path d="M5 3v4M3 5h4M19 17v4M17 19h4"/>
    </symbol>
    <symbol id="icon-qr" viewBox="0 0 24 24">
      <rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/>
      <rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"/>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
    </symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24">
      <path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3zM12 9v4M12 17h.01"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
    </symbol>
    <symbol id="icon-scan" viewBox="0 0 24 24">
      <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6M8 13h8M8 17h8"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.2a2 2 0 0 1-2 0l-.1-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.1.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.1.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.1-.1a2 2 0 0 1 2 0l.4.2a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.2a2 2 0 0 1 2 0l.1.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.1-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.1-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.1.1a2 2 0 0 1-2 0l-.4-.2a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24">
      <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24">
      <path d="M3 3v18h18M7 16l4-5 4 3 5-8"/>
    </symbol>
    <symbol id="icon-wrench" viewBox="0 0 24 24">
      <path d="M14.7 6.3a4 4 0 0 0-5-5L7.5 3.5l3 3L8.3 8.7l-3-3L3.1 8a4 4 0 0 0 5 5l9.8 9.8a2.1 2.1 0 0 0 3-3z"/>
    </symbol>
    <symbol id="icon-flask" viewBox="0 0 24 24">
      <path d="M9 3h6M10 3v6L4.5 19a1.8 1.8 0 0 0 1.6 2h11.8a1.8 1.8 0 0 0 1.6-2L14 9V3"/>
      <path d="M7 16h10"/>
    </symbol>
    <symbol id="icon-microscope" viewBox="0 0 24 24">
      <path d="M6 18h12M8 18a6 6 0 0 0 10-4M10 3h3v8h-3zM11.5 11v5M5 22h14"/>
      <path d="m14 5 3-2 2 2-2 3"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v5M14 11v5"/>
    </symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
    </symbol>
  </svg>

  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <a class="brand" href="#" data-view="chat" aria-label="返回群聊">
          <img src="assets/lab-mark.svg" alt="" width="36" height="36">
          <span>
            <strong>LabPilot</strong>
            <small>智研协作台</small>
          </span>
        </a>
        <button class="icon-button sidebar-collapse" id="sidebar-collapse" type="button" aria-label="收起侧栏" title="收起侧栏">
          <svg><use href="#icon-chevron-right"></use></svg>
        </button>
      </div>

      <button class="workspace-switcher" type="button" id="workspace-switcher">
        <span class="workspace-avatar">材</span>
        <span class="workspace-copy">
          <strong>先进材料实验室</strong>
          <small>公共仪器平台</small>
        </span>
        <svg><use href="#icon-chevron-down"></use></svg>
      </button>

      <nav class="primary-nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-view="chat">
          <svg><use href="#icon-message"></use></svg>
          <span>群聊协作</span>
          <span class="nav-badge" id="chat-badge">4</span>
        </button>
        <button class="nav-item" type="button" data-view="booking">
          <svg><use href="#icon-calendar"></use></svg>
          <span>仪器预约</span>
        </button>
        <button class="nav-item" type="button" data-view="ledger">
          <svg><use href="#icon-clipboard"></use></svg>
          <span>使用台账</span>
          <span class="nav-alert" id="ledger-badge">2</span>
        </button>
        <button class="nav-item" type="button" data-view="agents">
          <svg><use href="#icon-bot"></use></svg>
          <span>Team Agent</span>
        </button>
        <button class="nav-item" type="button" data-view="dashboard">
          <svg><use href="#icon-dashboard"></use></svg>
          <span>实验室看板</span>
        </button>
      </nav>

      <div class="sidebar-scroll">
        <section class="sidebar-section">
          <div class="section-heading">
            <span>协作群聊</span>
            <button class="icon-button subtle" type="button" id="new-group-button" aria-label="新建群聊" title="新建群聊">
              <svg><use href="#icon-plus"></use></svg>
            </button>
          </div>
          <div class="group-list" id="group-list"></div>
        </section>

        <section class="sidebar-section">
          <div class="section-heading">
            <span>Team Agents</span>
            <button class="icon-button subtle" type="button" id="new-agent-mini-button" aria-label="创建 Team Agent" title="创建 Team Agent">
              <svg><use href="#icon-plus"></use></svg>
            </button>
          </div>
          <div class="agent-mini-list" id="agent-mini-list"></div>
        </section>
      </div>

      <div class="sidebar-footer">
        <button class="user-chip" type="button" id="user-menu-button">
          <span class="avatar avatar-green">林</span>
          <span class="user-copy">
            <strong>林雨</strong>
            <small>课题组 · 管理员</small>
          </span>
          <svg><use href="#icon-more"></use></svg>
        </button>
      </div>
    </aside>

    <main class="main-panel" id="main-panel">
      <div class="mobile-topbar">
        <button class="icon-button" type="button" id="mobile-menu-button" aria-label="打开导航">
          <svg><use href="#icon-dashboard"></use></svg>
        </button>
        <a class="mobile-brand" href="#" data-view="chat">
          <img src="assets/lab-mark.svg" alt="" width="28" height="28">
          <strong>LabPilot</strong>
        </a>
        <button class="icon-button" type="button" aria-label="通知">
          <svg><use href="#icon-bell"></use></svg>
          <span class="dot"></span>
        </button>
      </div>
      <div class="view-root" id="view-root"></div>
    </main>

    <aside class="context-panel" id="context-panel"></aside>

    <nav class="mobile-nav" aria-label="移动端导航">
      <button class="mobile-nav-item is-active" type="button" data-view="chat">
        <svg><use href="#icon-message"></use></svg>
        <span>群聊</span>
      </button>
      <button class="mobile-nav-item" type="button" data-view="booking">
        <svg><use href="#icon-calendar"></use></svg>
        <span>预约</span>
      </button>
      <button class="mobile-nav-item" type="button" data-view="ledger">
        <svg><use href="#icon-clipboard"></use></svg>
        <span>台账</span>
      </button>
      <button class="mobile-nav-item" type="button" data-view="agents">
        <svg><use href="#icon-bot"></use></svg>
        <span>Agent</span>
      </button>
      <button class="mobile-nav-item" type="button" data-view="dashboard">
        <svg><use href="#icon-dashboard"></use></svg>
        <span>看板</span>
      </button>
    </nav>
  </div>

  <div class="overlay-backdrop" id="overlay-backdrop" hidden></div>
  <div class="modal-root" id="modal-root" aria-live="polite"></div>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
